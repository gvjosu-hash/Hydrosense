<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidrocense · Demo de redirección de agua</title>
<style>
  :root{--bg:#0b0f14;--card:#0f1420;--ink:#e7f0ff;--muted:#9fb0c7;--line:#1e2a3a;--flow:#4cc9f0;--bad:#ef476f;--ok:#3ddc97}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#0b0f14,#0d1117 60%);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#4cc9f0,#4895ef 60%,#4361ee);display:grid;place-items:center;font-weight:900}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 340px;gap:14px;width:100%}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  h2{margin:6px 0 10px 0;font-size:16px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  button{background:#0f1722;color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}
  button:hover{border-color:#2a3545}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .kpi{background:#0c1219;border:1px solid var(--line);border-radius:12px;padding:10px}
  .kpi h3{margin:0;color:var(--muted);font-size:11px;font-weight:600}
  .kpi .v{font-size:18px;margin-top:6px}
  svg{width:100%;height:520px;background:#0a0f15;border:1px solid var(--line);border-radius:14px}
  .pipe{stroke:#344154;stroke-width:8;stroke-linecap:round}
  .pipe.active{stroke:var(--flow)}
  .pipe.closed{stroke-dasharray:6 8;opacity:.6}
  .pipe.leak{stroke:var(--bad)}
  .valve{fill:#101826;stroke:#385064;stroke-width:2}
  .valve.open{fill:#0c2b22;stroke:#2dd4bf}
  .valve.closed{fill:#2a1116;stroke:#ef476f}
  .node{fill:#0e1621;stroke:#1f2b39;stroke-width:2}
  .consumer{fill:#0f1722;stroke:#2a3545;stroke-width:2}
  .drop{text-anchor:middle;dominant-baseline:middle;font-size:18px}
  .log{height:220px;overflow:auto;background:#0b1016;border:1px dashed #213042;border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.35}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 10px;border-radius:999px;color:var(--muted);font-size:12px;margin-right:6px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:6px}
  .c-flow{background:var(--flow)} .c-closed{background:#8892a0} .c-leak{background:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="logo">HC</div>
  <div style="font-weight:700">Hidrocense · Redirección de agua (demo)</div>
  <span style="margin-left:auto" class="tag">local</span>
</header>

<main>
  <section class="panel">
    <h2>Red hidráulica (simulación)</h2>
    <div class="legend">
      <span class="pill"><span class="dot c-flow"></span>Flujo activo</span>
      <span class="pill"><span class="dot c-closed"></span>Cerrado</span>
      <span class="pill"><span class="dot c-leak"></span>Fuga</span>
    </div>
    <svg id="net" viewBox="0 0 900 520" aria-label="Red de tuberías"></svg>
  </section>

  <aside class="panel">
    <h2>Controles</h2>
    <div class="controls">
      <button id="leakA">Fuga rama A</button>
      <button id="leakB">Fuga rama B</button>
      <button id="clear">Restablecer</button>
    </div>
    <div class="controls">
      <button id="v1">Toggle V1 (A)</button>
      <button id="v2">Toggle V2 (B)</button>
      <button id="v3">Toggle V3 (Bypass)</button>
    </div>
    <div class="controls">
      <button id="auto">Auto-redirigir: ON</button>
    </div>
    <div class="kpis">
      <div class="kpi"><h3>Estado</h3><div class="v" id="kState">OK</div></div>
      <div class="kpi"><h3>Rutas activas</h3><div class="v" id="kPaths">0</div></div>
      <div class="kpi"><h3>Válvulas</h3><div class="v" id="kValves">V1:• V2:• V3:•</div></div>
    </div>
    <h2 style="margin-top:12px">Eventos</h2>
    <div id="log" class="log"></div>
  </aside>
</main>

<script>
// ---- Nodos y tuberías (topología simple) ----
const nodes = {
  T:{x:80,y:260,label:'Tanque'},
  P:{x:180,y:260,label:'Bomba'},
  J:{x:320,y:260,label:'Distribución'},
  A1:{x:520,y:180,label:'Rama A'},
  A2:{x:600,y:180,label:'V1'},
  A:{x:760,y:150,label:'Sector A'},
  B1:{x:520,y:340,label:'Rama B'},
  B2:{x:600,y:340,label:'V2'},
  B:{x:760,y:370,label:'Sector B'},
  X:{x:560,y:260,label:'V3 (Bypass)'}
};

const edges = {
  eTP: {a:'T', b:'P'},
  ePJ: {a:'P', b:'J'},
  eJA1:{a:'J', b:'A1'},
  eA1A2:{a:'A1', b:'A2', valve:'V1', open:true},
  eA2A:{a:'A2', b:'A'},
  eJB1:{a:'J', b:'B1'},
  eB1B2:{a:'B1', b:'B2', valve:'V2', open:true},
  eB2B:{a:'B2', b:'B'},
  eA1X:{a:'A1', b:'X', valve:'V3', open:false},
  eXB1:{a:'X', b:'B1', valve:'V3', open:false}
};

for(const id in edges){ edges[id].leak=false; edges[id].closed=false; }

const svg = document.getElementById('net');
const logEl = document.getElementById('log');
const kState = document.getElementById('kState');
const kPaths = document.getElementById('kPaths');
const kValves = document.getElementById('kValves');
const pipeEls = {};

function log(msg){
  logEl.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + logEl.innerHTML;
}

function draw(){
  svg.innerHTML = '';
  // tuberías
  for(const id in edges){
    const e = edges[id], A=nodes[e.a], B=nodes[e.b];
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',A.x); line.setAttribute('y1',A.y);
    line.setAttribute('x2',B.x); line.setAttribute('y2',B.y);
    line.setAttribute('class','pipe'); line.dataset.id=id;
    svg.appendChild(line); pipeEls[id]=line;
    if(e.leak){
      const drop = document.createElementNS('http://www.w3.org/2000/svg','text');
      drop.setAttribute('x',(A.x+B.x)/2); drop.setAttribute('y',(A.y+B.y)/2 - 10);
      drop.setAttribute('class','drop'); drop.textContent='💧'; svg.appendChild(drop);
    }
  }
  // nodos
  for(const id in nodes){
    const n=nodes[id];
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',n.x); circle.setAttribute('cy',n.y);
    circle.setAttribute('r', id==='A'||id==='B'? 20 : (id==='A2'||id==='B2'||id==='X'? 12: 10));
    circle.setAttribute('class', id==='A'||id==='B' ? 'consumer' : (id==='A2'||id==='B2'||id==='X') ? 'valve' : 'node');
    // estado válvulas
    if(id==='A2'){ circle.classList.add(edges.eA1A2.open? 'open':'closed'); }
    if(id==='B2'){ circle.classList.add(edges.eB1B2.open? 'open':'closed'); }
    if(id==='X' ){ circle.classList.add((edges.eA1X.open && edges.eXB1.open)? 'open':'closed'); }
    svg.appendChild(circle);
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',n.x); label.setAttribute('y',n.y-18);
    label.setAttribute('text-anchor','middle'); label.textContent=n.label; svg.appendChild(label);
  }
}

function neighbors(nodeId){
  const out=[];
  for(const id in edges){
    const e=edges[id];
    if(e.leak || e.closed) continue;          // rota/no transitable
    if(e.valve && e.open!==true) continue;    // válvula cerrada
    if(e.a===nodeId) out.push({n:e.b, id});
    else if(e.b===nodeId) out.push({n:e.a, id});
  }
  return out;
}

function bfs(start, goal){
  const q=[start], seen=new Set([start]), prevN={}, prevE={};
  while(q.length){
    const u=q.shift(); if(u===goal) break;
    for(const {n,id} of neighbors(u)){
      if(seen.has(n)) continue; seen.add(n); prevN[n]=u; prevE[n]=id; q.push(n);
    }
  }
  if(!seen.has(goal)) return null;
  const nodesPath=[goal], edgesPath=[]; let cur=goal;
  while(cur!==start){ const eId=prevE[cur]; edgesPath.push(eId); cur=prevN[cur]; nodesPath.push(cur); }
  nodesPath.reverse(); edgesPath.reverse(); return {nodes:nodesPath, edges:edgesPath};
}

function highlight(activeEdges){
  for(const id in pipeEls){ pipeEls[id].classList.remove('active','closed','leak'); }
  for(const id in edges){
    const e = edges[id];
    if(e.leak) pipeEls[id].classList.add('leak');
    else if(e.valve && !e.open) pipeEls[id].classList.add('closed');
  }
  (activeEdges||[]).forEach(id=> pipeEls[id].classList.add('active'));
}

const flows = {A:null,B:null};
function polyline(path){ return path.nodes.map(id=>({x:nodes[id].x,y:nodes[id].y})); }
function totLen(pts){ let L=0; for(let i=0;i<pts.length-1;i++){ const dx=pts[i+1].x-pts[i].x, dy=pts[i+1].y-pts[i].y; L+=Math.hypot(dx,dy);} return L; }
function pointAt(pts,t){ const L=totLen(pts); let d=t*L; for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; const seg=Math.hypot(b.x-a.x,b.y-a.y); if(d<=seg){ const r=d/seg; return {x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r}; } d-=seg; } return pts[pts.length-1]; }

function recompute(){
  const pA=bfs('T','A'); const pB=bfs('T','B');
  flows.A = pA ? {path:pA, pts:polyline(pA), t:0.0} : null;
  flows.B = pB ? {path:pB, pts:polyline(pB), t:0.5} : null;
  const act = [...(pA?pA.edges:[]), ...(pB?pB.edges:[])];
  highlight(act);
  kPaths.textContent = (pA?1:0)+(pB?1:0);
  kState.textContent = Object.values(edges).some(e=>e.leak) ? 'ALERTA' : 'OK';
  const v1=edges.eA1A2.open?'abierta':'cerrada', v2=edges.eB1B2.open?'abierta':'cerrada', v3=(edges.eA1X.open&&edges.eXB1.open)?'abierta':'cerrada';
  kValves.textContent = `V1:${v1}  V2:${v2}  V3:${v3}`;
}

function animate(){
  svg.querySelectorAll('.bubble').forEach(n=>n.remove());
  function drawBubble(flow){
    if(!flow) return;
    flow.t=(flow.t+0.005)%1;
    const p=pointAt(flow.pts, flow.t);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',4);
    c.setAttribute('fill','none'); c.setAttribute('stroke',getComputedStyle(document.documentElement).getPropertyValue('--flow')||'#4cc9f0');
    c.setAttribute('class','bubble'); svg.appendChild(c);
  }
  drawBubble(flows.A); drawBubble(flows.B);
  requestAnimationFrame(animate);
}

function toggleValve(name){
  if(name==='V1'){ edges.eA1A2.open=!edges.eA1A2.open; log(`V1 ${edges.eA1A2.open?'abierta':'cerrada'}`); }
  if(name==='V2'){ edges.eB1B2.open=!edges.eB1B2.open; log(`V2 ${edges.eB1B2.open?'abierta':'cerrada'}`); }
  if(name==='V3'){ const nv=!(edges.eA1X.open && edges.eXB1.open); edges.eA1X.open=nv; edges.eXB1.open=nv; log(`V3 ${nv?'abierta':'cerrada'}`); }
  draw(); recompute();
}

let auto=true;
function setLeak(edgeId,on){
  edges[edgeId].leak = on;
  if(on){ log(`Fuga detectada en ${edgeId}`); }
  else { log(`Fuga reparada en ${edgeId}`); }
  // auto-redirección con bypass
  if(on && auto){
    // Si fuga afecta A, abre bypass para alimentar B (y viceversa)
    if(edgeId==='eJA1' || edgeId==='eA1A2' || edgeId==='eA2A'){ edges.eA1X.open=true; edges.eXB1.open=true; log('Auto: apertura de V3 (bypass) para desviar por rama B'); }
    if(edgeId==='eJB1' || edgeId==='eB1B2' || edgeId==='eB2B'){ edges.eA1X.open=true; edges.eXB1.open=true; log('Auto: apertura de V3 (bypass) para desviar por rama A'); }
  }
  draw(); recompute();
}

function resetNet(){
  for(const id in edges){ edges[id].leak=false; edges[id].closed=false; if(edges[id].valve==='V3'){ edges[id].open=false; } }
  edges.eA1A2.open=true; edges.eB1B2.open=true;
  log('Red restablecida'); draw(); recompute();
}

// UI
document.getElementById('leakA').addEventListener('click', ()=> setLeak('eJA1', true));
document.getElementById('leakB').addEventListener('click', ()=> setLeak('eJB1', true));
document.getElementById('clear').addEventListener('click', resetNet);
document.getElementById('v1').addEventListener('click', ()=> toggleValve('V1'));
document.getElementById('v2').addEventListener('click', ()=> toggleValve('V2'));
document.getElementById('v3').addEventListener('click', ()=> toggleValve('V3'));
document.getElementById('auto').addEventListener('click', (e)=>{ auto=!auto; e.target.textContent=`Auto-redirigir: ${auto?'ON':'OFF'}`; log(`Auto-redirección ${auto?'activada':'desactivada'}`); });

// Primer render
draw(); recompute(); animate();
</script>
</body>
</html>
